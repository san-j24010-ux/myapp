<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="全10問の4択で遊べる、みんなの雑学クイズです。">
  <title>みんなの雑学クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <div class="app-card">
      <p class="app-badge" aria-hidden="true">🧠 QUIZ GAME</p>

      <div id="loading" class="loading" role="status" aria-live="polite" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span id="loading-text">通信中です...</span>
      </div>

      <p id="error-message" class="message message-error" role="alert" hidden></p>

      <section id="start-screen" class="screen" aria-labelledby="start-title">
        <div class="hero-icon" aria-hidden="true">💡</div>
        <h1 id="start-title">みんなの雑学クイズ</h1>
        <p class="lead">身近な雑学に4択でチャレンジ！<br>全10問、100点満点を目指そう。</p>
        <div class="button-stack">
          <button id="start-button" class="button button-primary" type="button">クイズを始める</button>
          <button id="start-ranking-button" class="button button-secondary" type="button">ランキングを見る</button>
        </div>
      </section>

      <section id="quiz-screen" class="screen" aria-labelledby="question-text" hidden>
        <div class="quiz-status" aria-label="クイズの進み具合">
          <p>問題 <strong id="current-number">1</strong> / <strong id="total-number">10</strong></p>
          <p>スコア <strong id="current-score">0</strong>点</p>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <h2 id="question-text" class="question-text"></h2>
        <div id="choices" class="choices" role="group" aria-label="回答の選択肢"></div>
        <div id="answer-feedback" class="answer-feedback" aria-live="polite" hidden>
          <p id="answer-result" class="answer-result"></p>
          <p id="answer-explanation" class="answer-explanation"></p>
        </div>
        <button id="next-button" class="button button-primary" type="button" hidden>次の問題へ</button>
      </section>

      <section id="result-screen" class="screen" aria-labelledby="result-title" hidden>
        <div class="hero-icon" aria-hidden="true">🎉</div>
        <h2 id="result-title">結果発表</h2>
        <div class="result-score">
          <strong id="final-score">0</strong><span>点</span>
        </div>
        <dl class="result-details">
          <div><dt>正解数</dt><dd><span id="final-correct">0</span> / <span id="final-total">0</span>問</dd></div>
          <div><dt>正答率</dt><dd id="final-rate">0%</dd></div>
        </dl>

        <form id="score-form" class="score-form" novalidate>
          <label for="player-name">ランキング登録名（1〜20文字）</label>
          <input id="player-name" name="playerName" type="text" minlength="1" maxlength="20" autocomplete="nickname" required>
          <p id="name-error" class="field-error" role="alert" hidden></p>
          <button id="save-score-button" class="button button-primary" type="submit">スコアを登録する</button>
        </form>
        <p id="save-message" class="message message-success" role="status" hidden></p>

        <div class="button-stack compact">
          <button id="retry-button" class="button button-secondary" type="button">もう一度遊ぶ</button>
          <button id="result-ranking-button" class="button button-secondary" type="button">ランキングを見る</button>
        </div>
      </section>

      <section id="ranking-screen" class="screen" aria-labelledby="ranking-title" hidden>
        <div class="section-heading">
          <span aria-hidden="true">🏆</span>
          <h2 id="ranking-title">ランキング TOP 10</h2>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th scope="col">順位</th>
                <th scope="col">名前</th>
                <th scope="col">スコア</th>
                <th scope="col">正解数</th>
                <th scope="col">挑戦日時</th>
              </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
          </table>
          <p id="ranking-empty" class="empty-message" hidden>まだ記録がありません</p>
        </div>
        <button id="top-button" class="button button-secondary" type="button">トップへ戻る</button>
      </section>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
