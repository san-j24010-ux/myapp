<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sample Index</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; padding: 2rem; color: #222; }
    button { padding: .5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Sample Index</h1>
  <p>これは Google Apps Script とは関係のない、シンプルな静的サンプルページです。</p>
  <button id="timeBtn">現在時刻を表示</button>
  <p id="time" aria-live="polite"></p>
  <script>
    document.getElementById('timeBtn').addEventListener('click', function() {
      document.getElementById('time').textContent = new Date().toString();
    });
  </script>
</body>
</html>
