<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleFinder | 検索</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/search.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">StyleFinder</a>
      <nav class="global-nav" aria-label="メインナビゲーション">
        <a href="index.html">ホーム</a>
        <a href="favorite.html">お気に入り</a>
        <a href="ranking.html">ランキング</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="search-form-section" aria-labelledby="search-form-title">
      <h1 id="search-form-title">検索条件</h1>
      <form id="search-form" class="search-form">
        <fieldset>
          <legend>系統</legend>
          <select name="style" id="style">
            <option value="">指定なし</option>
            <option value="ストリート">ストリート</option>
            <option value="Y2K">Y2K</option>
            <option value="グランジ">グランジ</option>
            <option value="ゴープコア">ゴープコア</option>
            <option value="アメカジ">アメカジ</option>
            <option value="モード">モード</option>
            <option value="シティ">シティ</option>
            <option value="ヴィンテージ">ヴィンテージ</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>雰囲気</legend>
          <select name="vibe" id="vibe">
            <option value="">指定なし</option>
            <option value="ダーク">ダーク</option>
            <option value="ミニマル">ミニマル</option>
            <option value="ナチュラル">ナチュラル</option>
            <option value="エッジィ">エッジィ</option>
            <option value="ガーリー">ガーリー</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>性別</legend>
          <select name="gender" id="gender">
            <option value="">指定なし</option>
            <option value="メンズ">メンズ</option>
            <option value="レディース">レディース</option>
            <option value="ユニセックス">ユニセックス</option>
          </select>
        </fieldset>

        <fieldset>
          <legend>価格帯</legend>
          <select name="price" id="price">
            <option value="">指定なし</option>
            <option value="3000">3000円以下</option>
            <option value="5000">5000円以下</option>
            <option value="10000">10000円以下</option>
            <option value="10001">10000円以上</option>
          </select>
        </fieldset>

        <button type="submit" class="primary-button">検索</button>
      </form>
    </section>

    <section class="search-results" aria-labelledby="result-title">
      <h2 id="result-title">検索結果</h2>
      <div class="card-grid" id="search-results"></div>
    </section>
  </main>

  <script type="module" src="js/app.js" defer></script>
  <script type="module" src="js/search.js" defer></script>
</body>
</html>
